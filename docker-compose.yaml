# LiminalLM Production Docker Compose
# Includes app, PostgreSQL with pgvector, and Redis

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liminallm-app
    restart: unless-stopped
    ports:
      # Bind to localhost by default so the app is reachable through nginx (via
      # the docker network) but not published to the public interface. Set
      # HOST_BIND=0.0.0.0 for direct dev access without a proxy.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    environment:
      # Bootstrap only. Everything else is an admin-managed setting stored in
      # the database; INSTANCE_SETTINGS_JSON seeds those on first boot, and
      # the admin console owns them from then on.
      DATABASE_URL: postgresql://liminallm:${POSTGRES_PASSWORD}@postgres:5432/liminallm
      EMBEDDING_VECTOR_DIM: ${EMBEDDING_VECTOR_DIM:-1536}
      # Provider credentials, read as the last fallback when the matching
      # admin setting is blank.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # First-boot seed for the managed settings. redis_url matters here: its
      # default points at localhost, which inside this container is the
      # container itself rather than the redis service.
      INSTANCE_SETTINGS_JSON: >-
        {"redis_url": "redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0",
         "shared_fs_root": "/srv/liminallm",
         "model_backend": "${MODEL_BACKEND:-openai}",
         "model_path": "${MODEL_PATH:-gpt-4o-mini}",
         "app_base_url": "${APP_BASE_URL:-http://localhost:8000}",
         "embedding_model_id": "${EMBEDDING_MODEL_ID:-text-embedding-3-small}"}
    volumes:
      - liminallm-data:/srv/liminallm
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg16
    container_name: liminallm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: liminallm
      POSTGRES_USER: liminallm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # sql/ is deliberately NOT mounted into /docker-entrypoint-initdb.d.
      # That would apply schema.sql on first boot, before the migrate service
      # and without the -v embedding_dim only migrate.sh passes — and since
      # every statement is IF NOT EXISTS, the later real run would then be a
      # no-op that silently keeps the entrypoint's 1536-wide default.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liminallm -d liminallm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # The only thing that applies the schema. Runs on every deploy, not just
  # first boot, so schema changes reach existing volumes, then exits. The app
  # waits for it to complete successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liminallm-migrate
    environment:
      DATABASE_URL: postgresql://liminallm:${POSTGRES_PASSWORD}@postgres:5432/liminallm
      # Pins the vector column width, and must be the same value the app is
      # given below: startup compares the column against the encoder and
      # refuses to boot on a mismatch.
      EMBEDDING_VECTOR_DIM: ${EMBEDDING_VECTOR_DIM:-1536}
    command: ["bash", "/app/scripts/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: liminallm-redis
    restart: unless-stopped
    # Bug fix: Use :? syntax to require REDIS_PASSWORD, don't fall back to insecure default
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: liminallm-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    profiles:
      - production

volumes:
  liminallm-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  default:
    name: liminallm-network
