[project]
name = "liminallm"
version = "0.1.0"
description = "Small-kernel chat system with data-driven artifacts"
authors = [{name = "Liminal LM"}]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.24",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "argon2-cffi>=21.3",
  "psycopg[binary]>=3.2",
  "pypdf>=4.0",
  "psycopg-pool>=3.2",
  "redis>=5.0",
  # Imported at module scope by auth, web, sandbox, voice and the Gemini
  # backend. It was never declared and arrived only because `openai` depends
  # on it — a direct import satisfied by somebody else's dependency, which
  # holds until their dependency changes. CI installed a set without it and
  # the whole application failed to import.
  "httpx>=0.27,<1",
  "openai>=1.30",
  # The MCP wire, and the reason `liminallm/service/mcp_client.py` contains no
  # protocol code. Version negotiation, Streamable HTTP and the message types
  # are the SDK's; this repository owns authority, naming, network policy and
  # the data boundary around it.
  #
  # Runtime, not dev: a remote tool server is a product capability, and an
  # installation that discovers one needs the client at serving time. Capped
  # below 3 because the client construction and the result shape this depends
  # on are 2.x API, not a wire format the SDK would carry across a major.
  "mcp>=2,<3",
  "structlog>=24.4",
  "jsonschema>=4.22"
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
ocr = [
  # Plus the tesseract-ocr system package (apt/brew). Auto-detected at
  # runtime; without it, image extraction falls back to model vision.
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
]
# JAX is the primary training/serving framework (SPEC §5); install this
# extra wherever adapters are trained or served locally.
train = [
  "jax>=0.4.30",
  "optax>=0.2",
  "transformers>=4.40",
  # Reads the base checkpoint's shards framework-neutrally (numpy in, no
  # torch), which is how serving loads weights without a second runtime.
  "safetensors>=0.4",
  # Imported directly by `transformer.py` when it loads those shards. Arrives
  # with jax and safetensors anyway; named here because the code imports it.
  "numpy>=1.24",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  # `make test-fast-xdist` only. Installing it does not make an ordinary
  # pytest run parallel: xdist does nothing without -n.
  "pytest-xdist>=3.5",
  "ruff>=0.4",
  "bandit>=1.7",
  # `tests/test_declared_dependencies.py` reads pyproject.toml. `tomllib` is
  # stdlib from 3.11; 3.10 is this project's floor and needs the backport.
  "tomli>=2.0; python_version < '3.11'",
  # The arbiter for the served Responses wire (SPEC §16). Those tests hand
  # each payload to the SDK's generated types, which live under
  # `openai.types.responses` and do not exist in the base floor above — so a
  # minimum-version environment could not even collect them.
  #
  # Deliberately not raised at runtime: the API backend supports SDKs and
  # providers with no Responses endpoint and falls back to chat completions,
  # and raising the base floor would contradict that. Product runtime keeps
  # the old SDK; the conformance suite needs the generated types; the
  # lockfile records which schema snapshot was qualified.
  "openai>=2.8.1",
  # The browser lane (`make test-browser`). The package alone is not enough:
  # it needs a Chromium build, from `playwright install chromium` or from
  # LIMINALLM_CHROMIUM pointing at one. That is why the lane is excluded from
  # every default target rather than merely marked slow.
  "playwright>=1.40",
]

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["liminallm*"]
exclude = ["frontend*", "sql*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
# The repository root on sys.path, so `tests.harness` imports.
#
# `python -m pytest` puts the working directory there and bare `pytest` does
# not, so the suite ran locally and failed in CI with
# `ModuleNotFoundError: No module named 'tests'` the first time CI got as far
# as running it. Setting it here makes both invocations the same invocation,
# which is the property that was missing rather than the path itself.
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  # A test that spends seconds rather than milliseconds because it runs the
  # real thing: a training step, a forward pass, a process tree, a wall-clock
  # timeout. `make test-fast` skips these. `make test` and the pre-commit gate
  # do not, because nothing else covers what they cover.
  "slow: runs real model or real wall-clock work",
  # Drives a real browser against a real server. Not in any default lane:
  # it needs a Chromium binary, which `uv pip install playwright` alone does
  # not provide. `make test-browser` and its own CI job run it.
  "browser: drives a real browser against a real server",
]

[tool.coverage.run]
source = ["liminallm"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

