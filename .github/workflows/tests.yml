name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # TEMPORARY, and delete it once it has answered.
  #
  # The sandbox refuses to run model-written code unless the kernel gives it a
  # user namespace, and on this runner it refuses: `unshare` succeeds and the
  # very next line, writing "deny" to /proc/self/setgroups, returns EACCES.
  # That is the sandbox working — there is no unconfined fallback by design —
  # but it fails 31 tests here, and the choice between "enable the primitive on
  # the runner" and "prove the boundary in a confinement-capable lane instead"
  # depends on *which* policy is denying it. This job reports that rather than
  # letting anyone guess.
  #
  # Its own job, not a step in `test`, for a mundane reason: `test` emits ~2700
  # verbose lines and then the whole Postgres service-container log, so
  # anything printed before the tests is unreadable in practice. This log is
  # twenty lines.
  #
  # `continue-on-error` because a report that fails the build is a report
  # nobody gets to read.
  confinement-diagnostic:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kernel and distribution
        run: |
          uname -a
          cat /etc/os-release
          id

      - name: User-namespace policy
        run: |
          for knob in kernel.unprivileged_userns_clone user.max_user_namespaces \
                      kernel.apparmor_restrict_unprivileged_userns; do
            printf '%s = ' "$knob"; sysctl -n "$knob" 2>/dev/null || echo '(absent)'
          done
          echo "--- the two files _linux_available() actually reads ---"
          for f in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
            printf '%s = ' "$f"; cat "$f" 2>/dev/null || echo '(absent)'
          done
          echo "--- apparmor ---"
          aa-status 2>&1 | head -5 || true

      - name: Can this host unshare at all
        run: |
          unshare --user --map-root-user true; echo "unshare(1) rc=$?"

      # The same sequence confine.py performs, step by step, so the answer is
      # which call fails rather than whether something does.
      - name: The confinement sequence, one call at a time
        run: |
          python - <<'PY'
          import ctypes, ctypes.util, os
          from pathlib import Path
          libc = ctypes.CDLL(None, use_errno=True)
          NEWUSER, NEWNS, NEWNET = 0x10000000, 0x00020000, 0x40000000
          print("uid", os.getuid(), "euid", os.geteuid(), "gid", os.getgid())
          rc = libc.unshare(NEWUSER | NEWNS | NEWNET)
          print("unshare(NEWUSER|NEWNS|NEWNET) ->",
                "ok" if rc == 0 else f"errno {ctypes.get_errno()} "
                f"{os.strerror(ctypes.get_errno())}")
          if rc != 0:
              raise SystemExit(0)
          for path, value in (("/proc/self/setgroups", "deny"),
                              ("/proc/self/uid_map", f"0 {os.getuid()} 1"),
                              ("/proc/self/gid_map", f"0 {os.getgid()} 1")):
              try:
                  Path(path).write_text(value)
                  print(f"write {path} <- {value!r} -> ok")
              except OSError as exc:
                  print(f"write {path} <- {value!r} -> errno {exc.errno} {exc.strerror}")
          PY

      # What the application itself concludes, which is the number that decides
      # whether the tests run or fail.
      - name: What liminallm concludes
        run: |
          pip install -q -e . 2>&1 | tail -2 || true
          python -c "
          from liminallm.service.confine import backend_name, _linux_available
          print('_linux_available():', _linux_available())
          print('backend_name():', backend_name())"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run linter
        run: ruff check liminallm/ --select=E,F,W,I --ignore=E501

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    services:
      # pgvector, not plain postgres: the schema declares a VECTOR column, so a
      # cluster without the extension cannot even load it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: liminallm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] || pip install .
          pip install pytest pytest-cov jax jaxlib

      - name: Compile Python files
        run: python -m compileall liminallm

      # Runs the deploy command itself rather than reimplementing it, so a
      # break in scripts/migrate.sh is found here and not by an operator.
      - name: Apply schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/liminallm
          EMBEDDING_VECTOR_DIM: "64"
        run: bash scripts/migrate.sh

      - name: Run tests with coverage
        env:
          TEST_MODE: "true"
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/liminallm
          # The step above already applied the schema, with the deploy command.
          # Without this the suite would rebuild the schema itself and pass
          # over a migrate.sh that did nothing.
          TEST_SCHEMA_PREPARED: "true"
          EMBEDDING_VECTOR_DIM: "64"
        # `-m 'not browser'`: that lane needs a Chromium binary and has its
        # own job below. ALLOW_REDIS_FALLBACK_DEV is not set here because it
        # reaches nothing — the setting is admin-managed with no environment
        # variable, and TEST_MODE above is what actually permits the fallback.
        run: |
          pytest -m 'not browser' \
            --cov=liminallm --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run security scan
        # Enforce Bandit findings instead of ignoring failures during development
        run: bandit -r liminallm/ -ll --skip B101

  # The browser lane. Its own job because it needs a Chromium binary, and one
  # Python version because what it checks — what the SPA persists where
  # scripts can read it, and what the browser puts on the wire — does not vary
  # by interpreter. Previous defects at this seam were all invisible to
  # TestClient, which has no script context and no HttpOnly enforcement.
  browser:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: liminallm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] || pip install .
          pip install pytest playwright

      # The browser only. `--with-deps` brings the shared libraries a headless
      # Chromium needs on a bare runner.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Apply schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/liminallm
          EMBEDDING_VECTOR_DIM: "64"
        run: bash scripts/migrate.sh

      - name: Run the browser lane
        env:
          TEST_MODE: "true"
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/liminallm
          TEST_SCHEMA_PREPARED: "true"
          EMBEDDING_VECTOR_DIM: "64"
        run: pytest -m browser -v
