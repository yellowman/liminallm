# Docker Compose for QA/Testing Environment
# Usage: docker compose -f docker-compose.test.yml up --build
#
# Known test credentials (after bootstrap):
#   Admin: admin@test.local / TestAdmin123!
#
# Note: Regular users are created via signup during tests (smoke_test.sh creates one)

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: liminallm_test
      POSTGRES_USER: liminallm
      POSTGRES_PASSWORD: testpassword123
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liminallm -d liminallm_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://liminallm:testpassword123@postgres:5432/liminallm_test
      TEST_MODE: "false"
      # Admin bootstrap credentials
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: TestAdmin123!
      # Managed settings, seeded into Postgres on first boot only. Everything
      # this service configures beyond the six environment-only settings goes
      # here: managed settings have no environment variables of their own, so
      # a bare REDIS_URL reached nothing and left redis_url on its localhost
      # default — inside this container, nowhere.
      INSTANCE_SETTINGS_JSON: >-
        {"model_backend":"stub","redis_url":"redis://redis:6379/0","enable_mfa":false}
      # Filesystem
      SHARED_FS_ROOT: /srv/liminallm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - app_test_data:/srv/liminallm

  # Migration runner (runs once then exits)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://liminallm:testpassword123@postgres:5432/liminallm_test
    command: ["bash", "/app/scripts/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Bootstrap admin user (runs once then exits)
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://liminallm:testpassword123@postgres:5432/liminallm_test
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: TestAdmin123!
      SHARED_FS_ROOT: /srv/liminallm
      # This service builds the full Runtime, so it is normally the first
      # process able to seed. The same declaration is on `app` so either
      # startup order is correct, rather than two definitions of the truth.
      INSTANCE_SETTINGS_JSON: >-
        {"model_backend":"stub","redis_url":"redis://redis:6379/0","enable_mfa":false}
    command: ["python", "/app/scripts/bootstrap_admin.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_test_data:
  app_test_data:

# Network configuration
networks:
  default:
    name: liminallm-test
